<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6f8fb;font-family:"Zen Maru Gothic",sans-serif;color:#1d2433;display:grid;grid-template-columns:1fr 360px;align-items:center;padding:0 0 0 90px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:20px;font-size:64px;font-weight:700;letter-spacing:.04em;margin:0 0 40px}
.brand img{width:76px;height:76px}
.brand b{color:#2563d9;font-weight:900}
h1{font-size:68px;white-space:nowrap;font-weight:900;line-height:1.3;margin:0 0 28px;letter-spacing:.03em}
p{font-family:"Noto Sans JP",sans-serif;font-size:28px;color:#536079;margin:0}
.blocks{display:grid;grid-template-columns:repeat(2,130px);gap:20px}
.blocks span{width:130px;height:130px;border-radius:34px}
.blocks span:nth-child(1){background:#2563d9}
.blocks span:nth-child(2){background:#ffc93c;border-radius:50%;transform:translateY(26px)}
.blocks span:nth-child(3){background:#3fae5a;border-radius:34px 34px 34px 6px}
.blocks span:nth-child(4){background:#ef5a6f;transform:translateY(26px)}
</style></head><body>
<div>
<div class="brand"><img src="../assets/img/mark.svg" alt=""><span>Takate<b>LAB</b></span></div>
<h1>アイデアを、<br>手のひらのアプリに。</h1>
<p>スマートフォンアプリの企画・デザイン・開発</p>
</div>
<div class="blocks"><span></span><span></span><span></span><span></span></div>
</body></html>
